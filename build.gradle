plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'moon.bopspectremoon'
version = '1.0.0'
base { archivesName = 'BOP_Spectre_Moon' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    compileOnly files('run/mods/BiomesOPlenty-neoforge-1.21.1-21.1.0.14.jar')
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}


neoForge {
    version = '21.1.248'
    runs {
        client { client() }
    }
    mods {
        bop_spectre_moon { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes(['MixinConfigs': 'bop_spectre_moon.mixins.json'])
    }
}
